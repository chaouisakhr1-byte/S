name: Build S Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Build debug Android App Bundle
        run: gradle --no-daemon :app:bundleDebug

      - name: Verify debug App Bundle
        run: |
          AAB="app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package complete source handoff
        run: |
          PKG="$RUNNER_TEMP/S-delivery"
          mkdir -p "$PKG/S/build-artifacts"
          tar --exclude='./.git' --exclude='./.gradle' --exclude='./build' --exclude='./app/build' -cf - . | tar -C "$PKG/S" -xf -
          cp app/build/outputs/apk/debug/app-debug.apk "$PKG/S/build-artifacts/S-debug.apk"
          cp app/build/outputs/bundle/debug/app-debug.aab "$PKG/S/build-artifacts/S-debug.aab"
          git bundle create "$PKG/S/S-source-history.bundle" --all
          sha256sum "$PKG/S/build-artifacts/S-debug.apk" "$PKG/S/build-artifacts/S-debug.aab" "$PKG/S/S-source-history.bundle" > "$PKG/S/SHA256SUMS"
          cat > "$PKG/S/DELIVERY-README.md" <<'EOF'
          # S project handoff
          This archive contains the complete tracked project source, Git history bundle, and the verified debug APK and debug AAB from this workflow run.
          Both Android artifacts are signed with the debug key for testing only; they are not Play Store release artifacts.
          Production release signing and device-level runtime tests must be completed separately.
          EOF
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/S-Full-Project-Debug.zip" S)

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: S-Full-Project-Debug
          path: S-Full-Project-Debug.zip
          if-no-files-found: error
          retention-days: 30
