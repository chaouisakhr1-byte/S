plugins {
    id 'com.android.application'
}
android {
    namespace 'com.sstar.video'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sstar.video'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
    }
}
dependencies {
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
}
